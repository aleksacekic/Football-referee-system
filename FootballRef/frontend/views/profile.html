<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile — Sudija</title>
    <link rel="stylesheet" href="../styles/pages/profile.css" />
  </head>
  <body>
    <div class="profile-page">
      <!-- PROFILE HEADER -->
      <section class="card profile-header">
        <div class="avatar-wrapper">
          <img src="../assets/images/random-photo.jpg" alt="Avatar" />
          <button class="icon-btn">✎</button>
        </div>

        <div class="profile-meta">
          <h2>Aleksa Cekić</h2>
          <p>aleksa@example.com</p>
        </div>
      </section>

      <!-- PERSONAL INFO -->
      <section class="card">
        <h3>Personal information</h3>

        <div class="form-grid">
          <div class="field">
            <label>First name</label>
            <input type="text" value="Aleksa" />
          </div>

          <div class="field">
            <label>Last name</label>
            <input type="text" value="Cekić" />
          </div>

          <div class="field">
            <label>Email</label>
            <input type="email" value="aleksa@example.com" />
          </div>

          <div class="field">
            <label>Phone</label>
            <input type="text" />
          </div>
        </div>
      </section>

      <!-- INACTIVITY -->
      <section class="card subtle">
        <h3>Planned inactivity</h3>

        <div class="form-grid">
          <div class="field">
            <label>From</label>
            <input type="date" />
          </div>

          <div class="field">
            <label>To</label>
            <input type="date" />
          </div>

          <div class="field full">
            <label>Reason</label>
            <input type="text" />
          </div>
        </div>
      </section>

      <!-- SECURITY -->
      <section class="card">
        <h3>Security</h3>

        <button class="btn secondary">Change password</button>
      </section>

      <!-- DANGER ZONE -->
      <section class="card danger">
        <h3>Danger zone</h3>

        <button class="btn danger-btn">Request account deletion</button>
      </section>

      <!-- FOOTER ACTIONS -->
      <footer class="page-actions">
        <button class="btn ghost">Cancel</button>
        <button class="btn primary">Save changes</button>
      </footer>
    </div>
  </body>
</html>
