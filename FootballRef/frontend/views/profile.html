<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile — Sudija</title>
    <link rel="stylesheet" href="../styles/pages/profile.css" />
  </head>
  <body>
    <main class="profile-page">
      <header class="profile-header">
        <h1>My profile</h1>
        <p class="muted">Manage your account and availability</p>
      </header>

      <section class="profile-card">
        <!-- levi deo -->
        <div class="profile-left">
          <div class="avatar-wrap" aria-hidden="false">
            <img
              id="avatarImg"
              src="../assets/images/random-photo.jpg"
              alt="Profile photo"
              class="avatar"
            />
          </div>

          <div class="avatar-actions">
            <label for="avatarUpload" class="btn btn-outline"
              >Upload new photo</label
            >
            <input
              id="avatarUpload"
              type="file"
              accept="image/*"
              style="display: none"
            />

            <button
              type="button"
              id="removeAvatar"
              class="btn btn-danger-outline"
            >
              Remove photo
            </button>
          </div>

          <div class="account-actions">
            <button class="btn btn-primary">Change password</button>
            <button class="btn btn-danger">Request account deletion</button>
          </div>
        </div>

        <!-- desni deo -->
        <div class="profile-right">
          <form class="profile-form" autocomplete="off" novalidate>
            <div class="form-row">
              <label for="firstName">First name</label>
              <input id="firstName" type="text" value="Aleksa" />
            </div>

            <div class="form-row">
              <label for="lastName">Last name</label>
              <input id="lastName" type="text" value="Cekic" />
            </div>

            <div class="form-row">
              <label for="email">Email</label>
              <input id="email" type="email" value="aleksa@example.com" />
            </div>

            <div class="form-row">
              <label for="phone">Phone (optional)</label>
              <input id="phone" type="tel" value="+381 60 123 4567" />
            </div>

            <fieldset class="inactive-block" aria-labelledby="inactiveTitle">
              <legend id="inactiveTitle">Set temporary inactivity</legend>

              <p class="muted small">
                If you will be unavailable for officiating on certain dates,
                mark the period below.
              </p>

              <div class="inactive-row">
                <div class="form-row small">
                  <label for="inactiveFrom">From</label>
                  <input id="inactiveFrom" type="date" />
                </div>

                <div class="form-row small">
                  <label for="inactiveTo">To</label>
                  <input id="inactiveTo" type="date" />
                </div>
              </div>

              <div class="form-row">
                <label for="inactiveReason">Reason (optional)</label>
                <input
                  id="inactiveReason"
                  type="text"
                  placeholder="e.g. vacation"
                />
              </div>

              <div class="inactive-actions">
                <button class="btn btn-outline">Save inactivity</button>
                <button class="btn btn-ghost muted">Clear</button>
              </div>
            </fieldset>

            <div class="profile-save">
              <button class="btn btn-primary" type="submit">
                Save profile
              </button>
              <button class="btn btn-ghost">Cancel</button>
            </div>
          </form>
        </div>
      </section>

      <footer class="profile-foot">
        <small class="muted">Profile last updated: 24 Nov 2025</small>
      </footer>
    </main>
  </body>
</html>
