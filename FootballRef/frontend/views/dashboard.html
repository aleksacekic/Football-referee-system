<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- kalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

    <!-- css -->
    <link rel="stylesheet" href="../styles/pages/variables.css" />
    <link rel="stylesheet" href="../styles/pages/dashboard.css" />
    <link rel="stylesheet" href="../styles/pages/match.css" />
    <link rel="stylesheet" href="../styles/pages/leagues.css" />
    <link rel="stylesheet" href="../styles/pages/header.css" />

    <link rel="icon" href="../assets/images/whistle.png" type="image/x-icon" />
  </head>
  <body>
    <!--------------------------------------------------------------------------- HEADER------------------------------------------------------------------------------------------------------>
    <!--------------------------------------------------------------------------- HEADER------------------------------------------------------------------------------------------------------>
    <!--------------------------------------------------------------------------- HEADER------------------------------------------------------------------------------------------------------>
    <!--------------------------------------------------------------------------- HEADER------------------------------------------------------------------------------------------------------>
    <!--------------------------------------------------------------------------- HEADER------------------------------------------------------------------------------------------------------>
    <!--------------------------------------------------------------------------- HEADER------------------------------------------------------------------------------------------------------>
    <!-- #region -->

    <div
      class="tabs-header d-flex justify-content-between align-items-center px-3 py-2"
    >
      

      <!-- LEVI DEO – LOGO + TABOVI -->
      <div class="d-flex align-items-center gap-4">
        <!-- LOGO -->
        <img
          src="../assets/images/fss-logo.png"
          alt="Logo"
          class="header-logo"
        />

        <!-- TABS -->
        <!-- TAB NAV (u headeru) -->
        <ul class="nav nav-pills gap-2 d-none d-lg-flex" id="mainTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <a
              class="nav-link active"
              id="tab-dashboard"
              data-bs-toggle="tab"
              href="#panel-dashboard"
              role="tab"
              aria-controls="panel-dashboard"
              aria-selected="true"
              >Dashboard</a
            >
          </li>
          <li class="nav-item" role="presentation">
            <a
              class="nav-link"
              id="tab-scheduled"
              data-bs-toggle="tab"
              href="#panel-scheduled"
              role="tab"
              aria-controls="panel-scheduled"
              aria-selected="false"
              >My scheduled matches</a
            >
          </li>
          <li class="nav-item" role="presentation">
            <a
              class="nav-link"
              id="tab-past"
              data-bs-toggle="tab"
              href="#panel-past"
              role="tab"
              aria-controls="panel-past"
              aria-selected="false"
              >My past matches</a
            >
          </li>
          <li class="nav-item" role="presentation">
            <a
              class="nav-link"
              id="tab-leagues"
              data-bs-toggle="tab"
              href="#panel-leagues"
              role="tab"
              aria-controls="panel-leagues"
              aria-selected="false"
              >Leagues</a
            >
          </li>
        </ul>
      </div>

      <!-- DESNI DEO – USER DROPDOWN -->
      <div class="dropdown user-box">
        <button
          class="btn dropdown-toggle d-flex align-items-center user-dropdown-btn"
          type="button"
          id="userMenuButton"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img
            src="../assets/images/random-photo.jpg"
            alt="A"
            class="user-avatar"
          />
          <span class="user-name ms-2">Aleksa</span>
        </button>

        <ul
          class="dropdown-menu dropdown-menu-end"
          aria-labelledby="userMenuButton"
        >
          <li><a class="dropdown-item" onclick="goToProfile()">Profile</a></li>
          <li><a class="dropdown-item" href="#">Settings</a></li>
          <li><hr class="dropdown-divider" /></li>
          <li><a class="dropdown-item text-danger" href="#">Logout</a></li>
        </ul>
      </div>
    </div>


    <!-- #endregion -->

    <div class="tab-content mt-3 px-3" id="mainTabContent">
      <!--------------------------------------------------------------------------- DASHBOARD------------------------------------------------------------------------------------------------------>
      <div
        class="tab-pane fade show active"
        id="panel-dashboard"
        role="tabpanel"
        aria-labelledby="tab-dashboard"
      >
        <!-- ovde stavi ceo tvoj dashboard layout (kalendar + matches panel) -->
        <div class="container-fluid mt-3 px-3">
          <div class="row g-3">
            <div class="col-12 col-lg-7">
              <div id="calendar-wrapper"><div id="calendar"></div></div>
            </div>
            <div class="col-12 col-lg-5">
              <div id="matches-panel">
                <!-- PREBACENO U JS -->
              </div>
            </div>
          </div>
        </div>
      </div>

      <!--------------------------------------------------------------------------- SCHEDULED------------------------------------------------------------------------------------------------------>

      <div
        class="tab-pane fade"
        id="panel-scheduled"
        role="tabpanel"
        aria-labelledby="tab-scheduled"
      >
        <div class="p-3 scheduled-matches-root"></div>
      </div>

      <!------------------------------------------------------------------------- PAST ---------------------------------------------------------------------------->

      <div
        class="tab-pane fade"
        id="panel-past"
        role="tabpanel"
        aria-labelledby="tab-past"
      >
        <div class="p-3 past-matches-root"></div>
      </div>

      <!--------------------------------------------------------------------------- LEAGUES------------------------------------------------------------------------------------------------------>

      <div
        class="tab-pane fade"
        id="panel-leagues"
        role="tabpanel"
        aria-labelledby="tab-leagues"
      >
        <div class="p-3 leagues-root"></div>
      </div>
    </div>

    <!-- markup za bottom navigaciju -->
     <nav class="bottom-nav d-lg-none" id="bottomNav">
  <button class="bottom-nav-item active" data-tab="#tab-dashboard">
    <svg viewBox="0 0 24 24" class="bottom-nav-icon"><path d="M3 11l9-8 9 8M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Dashboard</span>
  </button>
  <button class="bottom-nav-item" data-tab="#tab-scheduled">
    <svg viewBox="0 0 24 24" class="bottom-nav-icon"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Zakazano</span>
  </button>
  <button class="bottom-nav-item" data-tab="#tab-past">
    <svg viewBox="0 0 24 24" class="bottom-nav-icon"><path d="M12 2a10 10 0 1 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 6v6l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Odigrano</span>
  </button>
  <button class="bottom-nav-item" data-tab="#tab-leagues">
    <svg viewBox="0 0 24 24" class="bottom-nav-icon"><path d="M4 21V10M12 21V3M20 21v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Lige</span>
  </button>
</nav>

    <script src="../js/main.js" type="module" defer></script>
    <script
      src="../js/controllers/matchesController.js"
      type="module"
      defer
    ></script>
    <script src="../js/controllers/loginController.js"></script>
    <script src="../js/views/leagueView.js" type="module" defer></script>
    <script src="../js/views/modalView.js" type="module" defer></script>
    <script src="../js/views/matchView.js" type="module" defer></script>

  </body>
</html>
