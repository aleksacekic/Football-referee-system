<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football referee — Login</title>
  <link rel="icon" href="/assets/images/whistle.png" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/pages/variables.css">
  <link rel="stylesheet" href="/styles/pages/login.css">
</head>
<body>

  <div class="login-page">

    <div class="login-card">
      <img src="/assets/images/fss-logo.png" alt="Fudbalski savez Srbije" class="login-logo" />

      <h2 class="login-title">Login</h2>

      <form class="login-form" action="" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••••" required />
        </div>

        <p id="loginError" class="login-error" role="alert" hidden></p>

        <button type="submit" class="btn-login">Log In</button>

        <div class="forgot-wrapper">
          <a href="#" class="forgot-link">Forgot your password?</a>
        </div>
      </form>
    </div>

  </div>

</body>
<script type="module" src="/js/controllers/login-controller.js"></script>
</html>
